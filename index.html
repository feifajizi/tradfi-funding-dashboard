<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股票合约费率监控</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--card:#0d1728cc;--line:#20304a;--muted:#8ea2c0;--text:#eef6ff;--cyan:#22d3ee;--green:#34d399;--red:#fb7185;--amber:#fbbf24;--blue:#60a5fa;--orange:#fb923c}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 20% 0%,#164e63 0,#07111f 34%),radial-gradient(circle at 90% 20%,#312e81 0,#07111f 32%);color:var(--text)}
    .wrap{max-width:1280px;margin:0 auto;padding:28px 18px 52px}.top{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}.eyebrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{border:1px solid var(--line);background:#0b1526;border-radius:999px;padding:7px 11px;color:#b8c7dc;font-size:13px}.pill.cyan{border-color:#155e75;color:#67e8f9;background:#08334499}h1{font-size:42px;line-height:1.05;margin:0 0 10px}.sub{color:var(--muted);margin:0;max-width:760px;line-height:1.7}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--cyan);color:#03131a;font-weight:800;cursor:pointer;white-space:nowrap}.btn:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(10px)}.stat .k{color:var(--muted);font-size:13px}.stat .v{font-size:26px;font-weight:850;margin-top:7px}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(10px)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr;gap:10px;margin-bottom:12px}input,select{width:100%;border:1px solid var(--line);background:#07111fcc;color:var(--text);border-radius:12px;padding:12px;font-size:14px}.exchanges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}.chip{border:1px solid var(--line);background:#07111f;color:#8ea2c0;border-radius:999px;padding:8px 12px;cursor:pointer}.chip.on[data-ex="Gate"]{color:#93c5fd;border-color:#1d4ed8;background:#1e3a8a55}.chip.on[data-ex="Bybit"]{color:#fdba74;border-color:#ea580c;background:#7c2d1255}.chip.on[data-ex="Binance"]{color:#fde68a;border-color:#ca8a04;background:#713f1255}.msg{padding:10px 12px;border-radius:12px;margin:10px 0;color:#fde68a;background:#713f1233;border:1px solid #92400e}.err{color:#fecaca;background:#7f1d1d44;border-color:#991b1b}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:980px}th{position:sticky;top:0;background:#081224;text-align:left;color:#9fb1ca;font-weight:650;font-size:13px;padding:12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #17243a;color:#dbeafe}tr:hover td{background:#13223a}.right{text-align:right}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.Gate{background:#1e3a8a66;color:#bfdbfe}.Bybit{background:#7c2d1266;color:#fed7aa}.Binance{background:#713f1266;color:#fde68a}.pos{color:var(--green);font-weight:850}.neg{color:var(--red);font-weight:850}.muted{color:var(--muted);font-size:12px}.link{color:#67e8f9;text-decoration:none}.foot{color:#7890b0;font-size:12px;margin-top:14px;line-height:1.6}@media(max-width:820px){.top{display:block}.btn{width:100%;margin-top:16px}.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}h1{font-size:32px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="eyebrow"><span class="pill cyan">独立版</span><span class="pill">Gate / Bybit / Binance</span><span class="pill">仅股票/ETF合约</span></div>
        <h1>股票合约费率监控</h1>
        <p class="sub">浏览器直接拉交易所公开接口，避开 Vercel 后端被 Bybit/Binance 拦截的问题。点“刷新实时费率”即可主动更新；虚拟货币合约已过滤。</p>
      </div>
      <button id="refresh" class="btn">刷新实时费率</button>
    </div>

    <div class="grid">
      <div class="stat"><div class="k">当前合约</div><div id="count" class="v">-</div></div>
      <div class="stat"><div class="k">最高绝对年化</div><div id="maxAbs" class="v">-</div></div>
      <div class="stat"><div class="k">做空收 / 做多收</div><div id="sides" class="v">-</div></div>
      <div class="stat"><div class="k">更新时间</div><div id="updated" class="v" style="font-size:18px">-</div></div>
    </div>

    <div class="panel">
      <div class="filters">
        <input id="q" placeholder="搜索股票代码：AAPL / NVDA / TSLA" />
        <input id="min" type="number" min="0" step="1" value="0" placeholder="最低绝对年化 %" />
        <select id="direction"><option value="all">全部方向</option><option value="short">做空收</option><option value="long">做多收</option></select>
        <select id="sort"><option value="abs">按绝对年化</option><option value="ann">按年化方向</option><option value="rate">按单期费率</option><option value="base">按股票代码</option><option value="exchange">按交易所</option></select>
      </div>
      <div class="exchanges">
        <button class="chip on" data-ex="Gate">Gate</button>
        <button class="chip on" data-ex="Bybit">Bybit</button>
        <button class="chip on" data-ex="Binance">Binance</button>
        <span id="filtered" class="muted" style="margin-left:auto">筛选后 - 条</span>
      </div>
      <div id="messages"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>交易所</th><th>品种</th><th class="right">费率/周期</th><th class="right">年化</th><th>收益方向</th><th class="right">标记价</th><th class="right">OI</th><th>下次结算</th><th class="right">链接</th></tr></thead>
          <tbody id="tbody"><tr><td colspan="9" style="text-align:center;color:#8ea2c0;padding:28px">点击刷新实时费率</td></tr></tbody>
        </table>
      </div>
      <div class="foot">说明：正费率=多头付费，做空收；负费率=空头付费，做多收。Binance/Bybit 若在你的网络环境被交易所拦截，会在上方显示具体错误。</div>
    </div>
  </div>

<script>
const STOCK_HINTS = new Set('AAPL AMD AMZN AVGO BABA BRKB COIN CRCL CRWV CSCO DIS GOOGL HD HOOD INTC JPM LITE META MRVL MSFT MSTR MU NBIS NVDA ORCL PAYP PLTR QCOM SNDK SOXL SPY QQQ TSLA TSM UBER USAR V WMT EWJ EWY COHR IBM LLY LMT MCD KO PEP PG UNH ARM ASML NFLX JNJ ABBV XOM HSBC'.split(' '));
let rows = [], errors = [];
const $ = id => document.getElementById(id);
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
const ann = (rate,h=8) => { const r=num(rate), hh=num(h); return r===null||!hh ? null : r*(24/hh)*365*100; };
const pct = (v,d=3) => v===null||v===undefined||!Number.isFinite(v) ? '-' : `${v>0?'+':''}${v.toFixed(d)}%`;
const fmt = (v,d=2) => v===null||v===undefined||!Number.isFinite(v) ? '-' : new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(v);
const time = v => { if(!v) return '-'; const d=new Date(v); return Number.isNaN(d.getTime())?'-':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}); };
const iso = v => { const n=num(v); if(!n) return null; return new Date(n<1e12?n*1000:n).toISOString(); };
async function getJson(url){ const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'}); if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }
function mk(o){ const a=ann(o.rate,o.intervalHours); return {...o,fundingRate:num(o.rate),fundingRatePct:num(o.rate)*100,intervalHours:num(o.intervalHours),annualizedPct:a,absAnnualizedPct:a===null?null:Math.abs(a),earnSide:a>0?'做空收':a<0?'做多收':'中性'}; }
async function fetchGate(){ const j=await getJson('https://crypto-intel-scanner.vercel.app/api/tradfi-funding?exchanges=gate&t='+Date.now()); return (j.data||[]).map(r=>mk({exchange:'Gate',symbol:r.symbol,base:r.base,rate:r.fundingRate,intervalHours:r.intervalHours,nextFundingTime:r.nextFundingTime,markPrice:r.markPrice,lastPrice:r.lastPrice,openInterest:r.openInterest,url:r.url})); }
async function fetchBybit(){ const [tick,inst]=await Promise.all([getJson('https://api.bybit.com/v5/market/tickers?category=linear'),getJson('https://api.bybit.com/v5/market/instruments-info?category=linear&limit=1000')]); const ticks=new Map((tick.result?.list||[]).map(x=>[x.symbol,x])); return (inst.result?.list||[]).filter(i=>i.status==='Trading'&&i.symbolType==='stock').map(i=>{ const t=ticks.get(i.symbol)||{}; return mk({exchange:'Bybit',symbol:i.symbol,base:String(i.baseCoin||i.symbol.replace(/USDT$/,'')).replace(/STOCK$/,''),rate:t.fundingRate,intervalHours:num(t.fundingIntervalHour)||num(i.fundingInterval)/60,nextFundingTime:iso(t.nextFundingTime),markPrice:num(t.markPrice),lastPrice:num(t.lastPrice),openInterest:num(t.openInterest),url:`https://www.bybit.com/trade/usdt/${encodeURIComponent(i.symbol)}`}); }); }
async function fetchBinance(){ const [premium,info]=await Promise.all([getJson('https://fapi.binance.com/fapi/v1/premiumIndex'),getJson('https://fapi.binance.com/fapi/v1/exchangeInfo')]); const prem=new Map((Array.isArray(premium)?premium:[]).map(x=>[x.symbol,x])); return (info.symbols||[]).filter(s=>s.status==='TRADING'&&s.underlyingType==='EQUITY').map(s=>{ const p=prem.get(s.symbol)||{}; return mk({exchange:'Binance',symbol:s.symbol,base:s.baseAsset||s.symbol.replace(/USDT$/,''),rate:p.lastFundingRate,intervalHours:8,nextFundingTime:iso(p.nextFundingTime),markPrice:num(p.markPrice),lastPrice:num(p.markPrice),openInterest:null,url:`https://www.binance.com/en/futures/${encodeURIComponent(s.symbol)}`}); }); }
async function refresh(){ $('refresh').disabled=true; $('refresh').textContent='刷新中...'; errors=[]; $('messages').innerHTML=''; const tasks=[['Gate',fetchGate],['Bybit',fetchBybit],['Binance',fetchBinance]]; const parts=await Promise.all(tasks.map(([ex,fn])=>fn().then(data=>({ex,data})).catch(e=>({ex,error:e.message,data:[]})))); rows=parts.flatMap(p=>{ if(p.error) errors.push(`${p.ex}: ${p.error}`); return p.data; }).filter(r=>r.fundingRate!==null); $('updated').textContent=time(new Date().toISOString()); render(); $('refresh').disabled=false; $('refresh').textContent='刷新实时费率'; }
function selected(){ return [...document.querySelectorAll('.chip.on')].map(x=>x.dataset.ex); }
function render(){ const q=$('q').value.trim().toUpperCase(), min=Number($('min').value||0), dir=$('direction').value, sort=$('sort').value, exs=selected(); let list=rows.filter(r=>exs.includes(r.exchange)).filter(r=>!q||r.symbol.includes(q)||r.base.includes(q)).filter(r=>(r.absAnnualizedPct||0)>=(Number.isFinite(min)?min:0)).filter(r=>dir==='all'||(dir==='short'&&(r.annualizedPct||0)>0)||(dir==='long'&&(r.annualizedPct||0)<0)); list.sort((a,b)=> sort==='base'||sort==='exchange' ? String(a[sort==='base'?'base':'exchange']).localeCompare(String(b[sort==='base'?'base':'exchange'])) : ((b[sort==='abs'?'absAnnualizedPct':sort==='ann'?'annualizedPct':'fundingRatePct']||0)-(a[sort==='abs'?'absAnnualizedPct':sort==='ann'?'annualizedPct':'fundingRatePct']||0))); const max=[...rows].sort((a,b)=>(b.absAnnualizedPct||0)-(a.absAnnualizedPct||0))[0]; $('count').textContent=rows.length; $('maxAbs').textContent=pct(max?.absAnnualizedPct,1); $('sides').textContent=`${rows.filter(r=>(r.annualizedPct||0)>0).length} / ${rows.filter(r=>(r.annualizedPct||0)<0).length}`; $('filtered').textContent=`筛选后 ${list.length} 条`; $('messages').innerHTML=errors.map(e=>`<div class="msg err">${e}</div>`).join(''); $('tbody').innerHTML=list.length?list.map(r=>`<tr><td><span class="badge ${r.exchange}">${r.exchange}</span></td><td><b>${r.base}</b><div class="muted">${r.symbol}</div></td><td class="right">${pct(r.fundingRatePct,4)}<div class="muted">/${r.intervalHours||'-'}h</div></td><td class="right ${r.annualizedPct>0?'pos':r.annualizedPct<0?'neg':''}">${pct(r.annualizedPct,1)}</td><td class="${r.annualizedPct>0?'pos':r.annualizedPct<0?'neg':''}">${r.earnSide}</td><td class="right">$${fmt(r.markPrice||r.lastPrice,4)}</td><td class="right">${fmt(r.openInterest,0)}</td><td>${time(r.nextFundingTime)}</td><td class="right"><a class="link" target="_blank" href="${r.url}">打开</a></td></tr>`).join(''):'<tr><td colspan="9" style="text-align:center;color:#8ea2c0;padding:28px">当前筛选下暂无数据</td></tr>'; }
$('refresh').onclick=refresh; ['q','min','direction','sort'].forEach(id=>$(id).addEventListener('input',render)); document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{b.classList.toggle('on');render()}); refresh();
</script>
</body>
</html>
